name: Sephoria Ticket Monitor

on:
  schedule:
    # Triggers at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch:

# Ensures only one instance of the monitoring workflow runs at a time
concurrency:
  group: ticket-checker
  cancel-in-progress: true

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ticket check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u check_tickets.py
